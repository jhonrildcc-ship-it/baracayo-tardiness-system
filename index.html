<!-- CENTRAL GOOGLE SHEETS CONNECTOR -->
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRSwV6WYGXrJOR7a8I6XTk67aB-LBckNKbjvWGRCYZHBml5utwqqzk7aTvCGiPWPAaXA/exec";

  // 1. ADVISER LOGIC: Auto-Detect Teacher's Section & Post Entry
  let isSubmitting = false;

  document.addEventListener('click', function (e) {
    const btn = e.target.closest('button, input[type="submit"]');

    if (btn && !isSubmitting) {
      const btnText = (btn.innerText || btn.value || '').toLowerCase();

      // Ignore auth/login or admin button clicks
      if (btnText.includes('login') || btnText.includes('sign in') || btnText.includes('admin')) return;

      if (btnText.includes('queue') || btnText.includes('submit') || btnText.includes('record') || btnText.includes('add')) {
        
        // Auto-detect logged-in teacher's Grade & Section from their active profile
        let userSection = '';
        let userGrade = '';
        try {
          const currentUser = JSON.parse(
            localStorage.getItem('currentUser') || 
            sessionStorage.getItem('currentUser') || 
            localStorage.getItem('user') || '{}'
          );
          userSection = currentUser.section || currentUser.assignedSection || currentUser.sectionName || '';
          userGrade = currentUser.grade || currentUser.gradeLevel || currentUser.assignedGrade || '';
        } catch(err) { 
          console.error('User profile lookup error:', err); 
        }

        const inputs = Array.from(document.querySelectorAll('input:not([type="hidden"]):not([type="password"]), select, textarea'));
        const todayStr = new Date().toISOString().split('T')[0];

        let payload = {
          date: todayStr,
          term: 'Term 1',
          gradeLevel: userGrade,
          section: userSection,
          lrn: '',
          studentName: '',
          timeOfArrival: '',
          minutesLate: '',
          reason: '',
          remarks: ''
        };

        inputs.forEach(function(input) {
          let val = input.tagName === 'SELECT' 
            ? (input.options[input.selectedIndex] ? input.options[input.selectedIndex].text.trim() : '') 
            : (input.value ? input.value.trim() : '');

          if (!val) return;

          const attr = ((input.name || input.id || '') + ' ' + (input.placeholder || '') + ' ' + (input.ariaLabel || '')).toLowerCase();

          if (attr.includes('date') && !attr.includes('validate')) payload.date = val;
          else if (attr.includes('term')) payload.term = val;
          else if (attr.includes('grade') && !payload.gradeLevel) payload.gradeLevel = val;
          else if (attr.includes('section') && !payload.section) payload.section = val;
          else if (attr.includes('lrn')) payload.lrn = val;
          else if (attr.includes('student') || attr.includes('name') || attr.includes('search')) {
            // Separate pure numeric LRNs from Student Names
            if (/^\d+$/.test(val)) {
              if (!payload.lrn) payload.lrn = val;
            } else {
              payload.studentName = val;
            }
          }
          else if (attr.includes('time') || attr.includes('arrival')) payload.timeOfArrival = val;
          else if (attr.includes('minute') || attr.includes('late') || attr.includes('computed')) payload.minutesLate = val;
          else if (attr.includes('reason') || input.tagName === 'SELECT') payload.reason = val;
          else if (attr.includes('remark') || attr.includes('option')) payload.remarks = val;
        });

        // Ensure we have at least an LRN or Student Name before logging
        if (!payload.studentName && !payload.lrn) return;

        // Prevent double-click rapid submissions
        isSubmitting = true;
        setTimeout(function() { isSubmitting = false; }, 2000);

        // Post directly to Google Sheets database
        const xhr = new XMLHttpRequest();
        xhr.open('POST', SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.onload = function() {
          if (typeof syncGoogleSheetsToDashboard === 'function') {
            syncGoogleSheetsToDashboard();
          }
        };
        xhr.send(new URLSearchParams(payload).toString());
      }
    }
  }, true);

  // 2. REAL-TIME CROSS-DEVICE DASHBOARD SYNC (Pulls Google Sheets entries live)
  function syncGoogleSheetsToDashboard() {
    fetch(SCRIPT_URL + '?t=' + new Date().getTime())
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data || data.length <= 1) return;

        // Dynamic Header Mapping
        const headers = data[0].map(function(h) { return String(h).toLowerCase().trim(); });
        const dateIdx = headers.findIndex(function(h) { return h.includes('date'); });
        const termIdx = headers.findIndex(function(h) { return h.includes('term'); });
        const gradeIdx = headers.findIndex(function(h) { return h.includes('grade'); });
        const secIdx = headers.findIndex(function(h) { return h.includes('section'); });
        const lrnIdx = headers.findIndex(function(h) { return h === 'lrn'; });
        const nameIdx = headers.findIndex(function(h) { return h.includes('student name') || h.includes('name'); });
        const arrivalIdx = headers.findIndex(function(h) { return h.includes('arrival') || h.includes('time'); });
        const lateIdx = headers.findIndex(function(h) { return h.includes('late') || h.includes('minute'); });
        const reasonIdx = headers.findIndex(function(h) { return h.includes('reason'); });
        const remarkIdx = headers.findIndex(function(h) { return h.includes('remark'); });

        const syncedRecords = [];
        const studentMap = new Map();

        // Process each row recorded in Google Sheets
        for (let i = 1; i < data.length; i++) {
          const row = data[i];
          const lrnVal = lrnIdx !== -1 ? String(row[lrnIdx]).trim() : '';
          const nameVal = nameIdx !== -1 ? String(row[nameIdx]).trim() : '';
          const studentIdentifier = lrnVal || nameVal;

          if (!studentIdentifier) continue;

          const gradeVal = gradeIdx !== -1 ? String(row[gradeIdx]).trim() : 'Grade 7';
          const sectionVal = secIdx !== -1 ? String(row[secIdx]).trim() : 'General';

          // A. Build Master Student List (Updates "Total Students" count across devices)
          if (!studentMap.has(studentIdentifier)) {
            studentMap.set(studentIdentifier, {
              id: 'std_' + studentIdentifier,
              lrn: lrnVal || studentIdentifier,
              name: nameVal || studentIdentifier,
              studentName: nameVal || studentIdentifier,
              grade: gradeVal,
              gradeLevel: gradeVal,
              section: sectionVal,
              status: 'Active'
            });
          }

          // B. Build Master Tardiness Log (Updates "Late Today" & Chart summaries)
          syncedRecords.push({
            id: 'gs_' + i,
            lrn: lrnVal,
            studentName: nameVal || lrnVal,
            date: dateIdx !== -1 ? String(row[dateIdx]).trim() : '',
            term: termIdx !== -1 ? String(row[termIdx]).trim() : 'Term 1',
            gradeLevel: gradeVal,
            section: sectionVal,
            timeOfArrival: arrivalIdx !== -1 ? String(row[arrivalIdx]).trim() : '',
            minutesLate: lateIdx !== -1 ? String(row[lateIdx]).trim() : '',
            reason: reasonIdx !== -1 ? String(row[reasonIdx]).trim() : 'Active',
            remarks: remarkIdx !== -1 ? String(row[remarkIdx]).trim() : ''
          });
        }

        // Save updated cross-device entries into local browser state for React UI rendering
        const studentArray = Array.from(studentMap.values());
        localStorage.setItem('students', JSON.stringify(studentArray));
        localStorage.setItem('tardyRecords', JSON.stringify(syncedRecords));
        localStorage.setItem('records', JSON.stringify(syncedRecords));

        // Trigger UI event re-render
        window.dispatchEvent(new Event('storage'));
      })
      .catch(function(err) {
        console.error('Real-time sync error:', err);
      });
  }

  // 3. LIVE AUTO-REFRESH & ADMIN MODAL SETUP
  function fetchAdminMasterData() {
    const container = document.getElementById('admin-sheets-modal-body');
    if (container) container.innerHTML = '<p style="padding: 20px; text-align: center;">Loading live section records...</p>';

    fetch(SCRIPT_URL + '?t=' + new Date().getTime())
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || data.length === 0) {
          if (container) container.innerHTML = '<p style="padding: 20px;">No records found in Google Sheet.</p>';
          return;
        }

        let tableHtml = '<table style="width:100%; border-collapse:collapse; font-family:sans-serif; text-align:left;">';
        data.forEach(function (row, rowIndex) {
          const isHeader = rowIndex === 0;
          const tag = isHeader ? 'th' : 'td';
          const bg = isHeader ? '#1a73e8' : (rowIndex % 2 === 0 ? '#f8f9fa' : '#ffffff');
          const color = isHeader ? '#ffffff' : '#333333';

          tableHtml += '<tr style="background-color: ' + bg + '; color: ' + color + ';">';
          row.forEach(function (cell) {
            tableHtml += '<' + tag + ' style="padding: 10px; border: 1px solid #ddd;">' + cell + '</' + tag + '>';
          });
          tableHtml += '</tr>';
        });
        tableHtml += '</table>';
        if (container) container.innerHTML = tableHtml;
      })
      .catch(function (err) {
        if (container) container.innerHTML = '<p style="padding: 20px; color: red;">Failed to load data. Check permissions.</p>';
      });
  }

  window.addEventListener('DOMContentLoaded', function () {
    const adminBtn = document.createElement('button');
    adminBtn.innerText = '📊 Central Admin View';
    adminBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 99999; padding: 12px 20px; background-color: #1a73e8; color: white; border: none; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-weight: bold; cursor: pointer;';

    const modal = document.createElement('div');
    modal.id = 'admin-sheets-modal';
    modal.style.cssText = 'display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100000; justify-content: center; align-items: center;';

    modal.innerHTML = '<div style="background: white; width: 90%; max-width: 900px; max-height: 85vh; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;">' +
      '<div style="padding: 15px 20px; background: #1a73e8; color: white; display: flex; justify-content: space-between; align-items: center;">' +
        '<h3 style="margin: 0;">Live Admin View — All Section Records</h3>' +
        '<button id="close-admin-modal" style="background: transparent; border: none; color: white; font-size: 20px; cursor: pointer;">✕</button>' +
      '</div>' +
      '<div id="admin-sheets-modal-body" style="padding: 20px; overflow-y: auto; flex: 1;"></div>' +
    '</div>';

    document.body.appendChild(adminBtn);
    document.body.appendChild(modal);

    adminBtn.addEventListener('click', function () {
      modal.style.display = 'flex';
      fetchAdminMasterData();
    });

    document.getElementById('close-admin-modal').addEventListener('click', function () {
      modal.style.display = 'none';
    });

    // Run real-time sync on load and poll every 5 seconds for immediate cross-device updates
    syncGoogleSheetsToDashboard();
    setInterval(syncGoogleSheetsToDashboard, 5000);
  });
</script>
</body>
</html>

<!-- CENTRAL GOOGLE SHEETS CONNECTOR -->
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQLbtvXb5CYoXSzA_qtOCqQbn6vo75Lha0rnfRRy4SY2viTiGajd4XW_9mLzzUfkOZGA/exec";

  // 1. ADVISER LOGIC: Guarded Single-Submission Form Extractor
  let isSubmitting = false;

  document.addEventListener('click', function (e) {
    const btn = e.target.closest('button, input[type="submit"]');

    if (btn && !isSubmitting) {
      const btnText = (btn.innerText || btn.value || '').toLowerCase();
      
      if (btnText.includes('submit') || btnText.includes('record') || btnText.includes('add') || btnText.includes('save') || btn.type === 'submit') {
        
        const allInputs = Array.from(document.querySelectorAll('input:not([type="hidden"]), select, textarea'));
        
        let lrn = '';
        let studentName = '';
        let section = '';
        let reason = '';

        allInputs.forEach(function(input) {
          let val = '';
          if (input.tagName === 'SELECT') {
            val = input.options[input.selectedIndex] ? input.options[input.selectedIndex].text.trim() : '';
          } else {
            val = input.value ? input.value.trim() : '';
          }

          if (!val) return;

          const attr = (input.name || input.id || input.placeholder || '').toLowerCase();

          if (attr.includes('lrn') || attr.includes('id')) {
            lrn = val;
          } else if (attr.includes('name') || attr.includes('student')) {
            if (!val.toLowerCase().includes('term') && !val.toLowerCase().includes('select')) {
              studentName = val;
            }
          } else if (attr.includes('section') || attr.includes('grade') || attr.includes('level') || attr.includes('class')) {
            section = val;
          } else if (attr.includes('reason') || attr.includes('remark') || input.tagName === 'SELECT') {
            reason = val;
          }
        });

        const textInputs = allInputs.filter(i => i.tagName === 'INPUT' && i.type !== 'hidden');
        if (!lrn && textInputs[0]) lrn = textInputs[0].value.trim();
        if (!studentName && textInputs[1]) studentName = textInputs[1].value.trim();
        if (!section && textInputs[2]) section = textInputs[2].value.trim();

        const selectEl = document.querySelector('select');
        if (selectEl) {
          reason = selectEl.options[selectEl.selectedIndex].text.trim();
        }

        if (!lrn && !studentName) {
          console.log('Submission blocked: Form fields are empty.');
          return;
        }

        isSubmitting = true;
        setTimeout(function() { isSubmitting = false; }, 2000);

        const payload = {
          lrn: lrn,
          studentName: studentName,
          section: section,
          reason: reason || 'No reason given'
        };

        const xhr = new XMLHttpRequest();
        xhr.open('POST', SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.send(new URLSearchParams(payload).toString());
        console.log('Single record submitted cleanly:', payload);
      }
    }
  }, true);

  // 2. ADMIN LOGIC: Live Admin View Popup Modal
  function fetchAdminMasterData() {
    const container = document.getElementById('admin-sheets-modal-body');
    if (container) container.innerHTML = '<p style="padding: 20px; text-align: center;">Loading all section records...</p>';

    fetch(SCRIPT_URL)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || data.length === 0) {
          if (container) container.innerHTML = '<p style="padding: 20px;">No records found in Google Sheet.</p>';
          return;
        }

        let tableHtml = '<table style="width:100%; border-collapse:collapse; font-family:sans-serif; text-align:left;">';
        data.forEach(function (row, rowIndex) {
          const isHeader = rowIndex === 0;
          const tag = isHeader ? 'th' : 'td';
          const bg = isHeader ? '#1a73e8' : (rowIndex % 2 === 0 ? '#f8f9fa' : '#ffffff');
          const color = isHeader ? '#ffffff' : '#333333';

          tableHtml += '<tr style="background-color: ' + bg + '; color: ' + color + ';">';
          row.forEach(function (cell) {
            tableHtml += '<' + tag + ' style="padding: 10px; border: 1px solid #ddd;">' + cell + '</' + tag + '>';
          });
          tableHtml += '</tr>';
        });
        tableHtml += '</table>';
        if (container) container.innerHTML = tableHtml;
      })
      .catch(function (err) {
        console.error('Error fetching admin records:', err);
        if (container) container.innerHTML = '<p style="padding: 20px; color: red;">Failed to load data. Check script URL & permissions.</p>';
      });
  }

  window.addEventListener('DOMContentLoaded', function () {
    const adminBtn = document.createElement('button');
    adminBtn.innerText = '📊 Central Admin View';
    adminBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 99999; padding: 12px 20px; background-color: #1a73e8; color: white; border: none; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-weight: bold; cursor: pointer;';

    const modal = document.createElement('div');
    modal.id = 'admin-sheets-modal';
    modal.style.cssText = 'display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100000; justify-content: center; align-items: center;';

    modal.innerHTML = '<div style="background: white; width: 90%; max-width: 900px; max-height: 85vh; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;">' +
      '<div style="padding: 15px 20px; background: #1a73e8; color: white; display: flex; justify-content: space-between; align-items: center;">' +
        '<h3 style="margin: 0;">Live Admin View — All Section Records</h3>' +
        '<button id="close-admin-modal" style="background: transparent; border: none; color: white; font-size: 20px; cursor: pointer;">✕</button>' +
      '</div>' +
      '<div id="admin-sheets-modal-body" style="padding: 20px; overflow-y: auto; flex: 1;"></div>' +
    '</div>';

    document.body.appendChild(adminBtn);
    document.body.appendChild(modal);

    adminBtn.addEventListener('click', function () {
      modal.style.display = 'flex';
      fetchAdminMasterData();
    });

    document.getElementById('close-admin-modal').addEventListener('click', function () {
      modal.style.display = 'none';
    });
  });
</script>
</body>

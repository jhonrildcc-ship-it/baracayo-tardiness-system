<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baracayo Integrated School - Tardiness System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-slate-900 text-slate-100">

  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect } = React;

    const SPREADSHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwRSwV6WYGXRJOR7a8I6XTk67aB-LBckNKbjvWGRCYZHBml5utwqqzk7aTvCGiPWPaaXA/exec';
    const GRADE_LEVELS = ['Grade 7', 'Grade 8', 'Grade 9', 'Grade 10', 'Grade 11', 'Grade 12'];
    const REASON_CATEGORIES = ['Transportation', 'Weather / Rain', 'Health / Medical', 'Personal / Family', 'Distance / Travel Time', 'Other'];

    function App() {
      const [activeRole, setActiveRole] = useState(() => localStorage.getItem('bis_user_role') || null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [records, setRecords] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [formData, setFormData] = useState({
        studentId: '',
        studentName: '',
        gradeLevel: 'Grade 7',
        section: '',
        date: new Date().toISOString().split('T')[0],
        arrivalTime: '07:30 AM',
        reasonCategory: 'Transportation',
        notes: '',
      });

      const fetchRecordsFromSheets = async () => {
        try {
          const response = await fetch(SPREADSHEET_API_URL);
          if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data)) setRecords(data);
          }
        } catch (error) {
          console.error('Failed to sync:', error);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchRecordsFromSheets();
        const interval = setInterval(fetchRecordsFromSheets, 10000);
        return () => clearInterval(interval);
      }, []);

      const handleSelectRole = (role) => {
        setActiveRole(role);
        if (role) localStorage.setItem('bis_user_role', role);
        else localStorage.removeItem('bis_user_role');
      };

      const handleAddRecord = async (evt) => {
        evt.preventDefault();
        if (!formData.studentName || !formData.section) return;

        setIsSubmitting(true);
        const newEntry = {
          id: `TRD-${Math.floor(1000 + Math.random() * 9000)}`,
          ...formData,
          status: 'Recorded',
        };

        try {
          setRecords((prev) => [newEntry, ...prev]);

          await fetch(SPREADSHEET_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newEntry),
            mode: 'no-cors',
          });

          setFormData({
            studentId: '',
            studentName: '',
            gradeLevel: 'Grade 7',
            section: '',
            date: new Date().toISOString().split('T')[0],
            arrivalTime: '07:30 AM',
            reasonCategory: 'Transportation',
            notes: '',
          });

          setTimeout(fetchRecordsFromSheets, 1500);
          setActiveTab('records');
        } catch (error) {
          console.error('Error posting record:', error);
        } finally {
          setIsSubmitting(false);
        }
      };

      if (!activeRole) {
        return e('div', { className: 'min-h-screen bg-slate-900 text-white flex flex-col justify-center items-center p-6' },
          e('div', { className: 'max-w-xl w-full text-center space-y-8' },
            e('div', { className: 'space-y-3' },
              e('h1', { className: 'text-4xl font-bold text-blue-400' }, 'Baracayo Integrated School'),
              e('p', { className: 'text-xl text-slate-300' }, 'Tardiness Monitoring System'),
              e('p', { className: 'text-sm text-slate-400' }, 'Real-time Cloud Spreadsheet Syncing Enabled')
            ),
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              e('button', {
                onClick: () => handleSelectRole('gate_scanner'),
                className: 'p-6 bg-slate-800 border border-slate-700 hover:border-blue-500 rounded-xl space-y-3 transition text-left'
              },
                e('div', { className: 'text-2xl' }, '📋'),
                e('span', { className: 'font-semibold text-lg block' }, 'Gate Scanner Mode'),
                e('span', { className: 'text-xs text-slate-400' }, 'Quick student entry logging')
              ),
              e('button', {
                onClick: () => handleSelectRole('admin'),
                className: 'p-6 bg-slate-800 border border-slate-700 hover:border-emerald-500 rounded-xl space-y-3 transition text-left'
              },
                e('div', { className: 'text-2xl' }, '📊'),
                e('span', { className: 'font-semibold text-lg block' }, 'Central Admin Portal'),
                e('span', { className: 'text-xs text-slate-400' }, 'View real-time synced logs')
              )
            )
          )
        );
      }

      return e('div', { className: 'min-h-screen bg-slate-50 text-slate-800 flex flex-col' },
        e('header', { className: 'bg-slate-900 text-white p-4 flex justify-between items-center shadow-md' },
          e('div', null,
            e('h1', { className: 'font-bold text-base' }, 'Baracayo Integrated School'),
            e('p', { className: 'text-xs text-slate-400' }, activeRole === 'admin' ? 'Central Admin Portal' : 'Gate Terminal Scanner')
          ),
          e('div', { className: 'flex items-center space-x-3' },
            e('button', {
              onClick: fetchRecordsFromSheets,
              className: 'bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-md font-medium'
            }, '🔄 Sync Now'),
            e('button', {
              onClick: () => handleSelectRole(null),
              className: 'bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-md'
            }, 'Switch Role')
          )
        ),
        e('div', { className: 'max-w-7xl mx-auto w-full p-6 space-y-6' },
          activeRole === 'admin' && e('div', { className: 'flex space-x-2 border-b border-slate-200 pb-2' },
            e('button', {
              onClick: () => setActiveTab('dashboard'),
              className: `px-4 py-2 rounded-lg text-sm font-semibold ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-600'}`
            }, 'Overview'),
            e('button', {
              onClick: () => setActiveTab('records'),
              className: `px-4 py-2 rounded-lg text-sm font-semibold ${activeTab === 'records' ? 'bg-blue-600 text-white' : 'text-slate-600'}`
            }, `Live Records (${records.length})`)
          ),
          (activeRole === 'gate_scanner' || activeTab === 'add') && e('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-xl mx-auto space-y-4' },
            e('h2', { className: 'text-lg font-bold text-slate-800' }, 'Record Tardy Student'),
            e('form', { onSubmit: handleAddRecord, className: 'space-y-4' },
              e('div', { className: 'grid grid-cols-2 gap-4' },
                e('input', {
                  type: 'text',
                  required: true,
                  placeholder: 'Student ID',
                  value: formData.studentId,
                  onChange: (evt) => setFormData({ ...formData, studentId: evt.target.value }),
                  className: 'border p-2 rounded text-sm w-full'
                }),
                e('input', {
                  type: 'text',
                  required: true,
                  placeholder: 'Student Full Name',
                  value: formData.studentName,
                  onChange: (evt) => setFormData({ ...formData, studentName: evt.target.value }),
                  className: 'border p-2 rounded text-sm w-full'
                })
              ),
              e('div', { className: 'grid grid-cols-2 gap-4' },
                e('select', {
                  value: formData.gradeLevel,
                  onChange: (evt) => setFormData({ ...formData, gradeLevel: evt.target.value }),
                  className: 'border p-2 rounded text-sm w-full'
                }, GRADE_LEVELS.map(g => e('option', { key: g, value: g }, g))),
                e('input', {
                  type: 'text',
                  required: true,
                  placeholder: 'Section',
                  value: formData.section,
                  onChange: (evt) => setFormData({ ...formData, section: evt.target.value }),
                  className: 'border p-2 rounded text-sm w-full'
                })
              ),
              e('div', { className: 'grid grid-cols-2 gap-4' },
                e('input', {
                  type: 'text',
                  value: formData.arrivalTime,
                  onChange: (evt) => setFormData({ ...formData, arrivalTime: evt.target.value }),
                  className: 'border p-2 rounded text-sm w-full'
                }),
                e('select', {
                  value: formData.reasonCategory,
                  onChange: (evt) => setFormData({ ...formData, reasonCategory: evt.target.value }),
                  className: 'border p-2 rounded text-sm w-full'
                }, REASON_CATEGORIES.map(c => e('option', { key: c, value: c }, c)))
              ),
              e('textarea', {
                placeholder: 'Notes / Specific Reason',
                value: formData.notes,
                onChange: (evt) => setFormData({ ...formData, notes: evt.target.value }),
                className: 'border p-2 rounded text-sm w-full'
              }),
              e('button', {
                type: 'submit',
                disabled: isSubmitting,
                className: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition'
              }, isSubmitting ? 'Syncing to Google Sheets...' : 'Submit Entry')
            )
          ),
          activeRole === 'admin' && activeTab === 'records' && e('div', { className: 'bg-white rounded-xl border border-slate-200 p-6 space-y-4' },
            e('div', { className: 'flex justify-between items-center' },
              e('h2', { className: 'text-lg font-bold text-slate-800' }, 'Synced Google Sheet Data'),
              e('span', { className: 'text-xs text-slate-400' }, loading ? 'Fetching updates...' : `Total: ${records.length} records`)
            ),
            e('div', { className: 'overflow-x-auto' },
              e('table', { className: 'w-full text-left text-sm border-collapse' },
                e('thead', null,
                  e('tr', { className: 'bg-slate-100 border-b' },
                    e('th', { className: 'p-3' }, 'ID'),
                    e('th', { className: 'p-3' }, 'Student Name'),
                    e('th', { className: 'p-3' }, 'Grade & Section'),
                    e('th', { className: 'p-3' }, 'Date'),
                    e('th', { className: 'p-3' }, 'Time'),
                    e('th', { className: 'p-3' }, 'Reason')
                  )
                ),
                e('tbody', { className: 'divide-y divide-slate-100' },
                  records.map((item, idx) => e('tr', { key: item.id || idx },
                    e('td', { className: 'p-3 font-mono text-xs' }, item.id),
                    e('td', { className: 'p-3 font-medium' }, item.studentName),
                    e('td', { className: 'p-3' }, `${item.gradeLevel} - ${item.section}`),
                    e('td', { className: 'p-3' }, item.date),
                    e('td', { className: 'p-3' }, item.arrivalTime),
                    e('td', { className: 'p-3' }, item.reasonCategory)
                  ))
                )
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
